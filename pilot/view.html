<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interspace · Sample Project run</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#edf0ef,#171c1c);--paper:light-dark(#fafcf8,#222b29);--ink:light-dark(#24372e,#e5eddf);--muted:light-dark(#536558,#adbdad);--line:light-dark(#c4cfc2,#435448);--accent:light-dark(#3b663e,#bcdd94)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif}header{padding:20px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}header strong{font-size:23px;letter-spacing:-1px}small,.muted{color:var(--muted)}main{max-width:1240px;margin:auto;padding:32px 5%}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1.5px;margin:5px 0 12px;line-height:1.2}h2{font-size:18px;margin:12px 0}h3{font-size:15px;margin:10px 0}p{margin:8px 0 16px}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);padding:10px 14px;border-radius:4px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}section,.panel{min-width:0}article,.panel{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:20px}.grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}.task{border-top:1px solid var(--line);padding:16px 0}.task strong{display:block}.tag{font:11px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}.notice{border-left:3px solid var(--accent);padding:10px 16px;margin:20px 0;background:var(--paper)}#output{overflow-wrap:anywhere}.finding{padding:18px 0;border-top:1px solid var(--line)}.citation{display:block;text-align:left;font:12px/1.6 ui-monospace,monospace;margin:7px 0;max-width:100%;overflow-wrap:anywhere}details{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer}pre{font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto}li{margin:10px 0}code{overflow-wrap:anywhere}footer{margin:30px 0;color:var(--muted);font-size:12px}[hidden]{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:24px 16px}.panel{padding:16px}.tasks{display:grid;grid-template-columns:1fr 1fr;gap:14px}}@media(max-width:390px){.tasks{grid-template-columns:1fr}}
</style>
<header><strong>◌ interspace</strong><span class="tag">READ-ONLY PILOT / SAMPLE PROJECT</span></header>
<main><div class="tag">Executed run · session bridge</div><h1>Evidence before the next experiment.</h1><p id="goal"></p><div class="notice" id="safety" role="status"></div>
<div class="grid"><aside class="panel"><span class="tag">Orchestrator's team</span><h2 id="stage"></h2><div class="tasks" id="tasks"></div><details><summary>Scope & usage</summary><p id="provider"></p><p id="usage"></p><p>Inputs: selected committed technical files. Outputs: this run only. No simulation, source edits or benchmark execution.</p><p>Snapshot revision</p><code id="revision"></code></details></aside>
<section><nav aria-label="Run results"><button data-tab="researcher" aria-pressed="true">Research report</button><button data-tab="reviewer" aria-pressed="false">Review</button><button data-tab="events" aria-pressed="false">Run history</button><button data-tab="sources" aria-pressed="false">Sources</button></nav><article id="output" aria-live="polite"></article><article id="source-view" hidden style="margin-top:16px"><h2 id="source-title"></h2><pre id="source-lines" tabindex="0"></pre></article></section></div>
<footer id="run-id"></footer></main>
<script>
const data=/*RUN_DATA*/null;
const $=id=>document.getElementById(id);
const node=(tag,text,parent)=>{const el=document.createElement(tag);el.textContent=text;if(parent)parent.append(el);return el;};
const labels={researcher:'Researcher',reviewer:'Reviewer',completed:'Complete',needs_revision:'Needs revision',blocked:'Blocked'};
$('goal').textContent=data.goal;$('stage').textContent=labels[data.stage]||data.stage;$('provider').textContent=data.provider;$('usage').textContent=data.usage;$('revision').textContent=data.revision;$('run-id').textContent=data.id+' · Offline view of recorded events; refresh after rendering a newer state.';
$('safety').textContent=data.verification?(data.verification.unchanged?'Source integrity verified: the sample project’s tracked files, Git status and HEAD match the pre-run baseline.':'Source changed since the baseline. Review differences before continuing.'):'Source integrity check pending. Workers receive committed snapshots only.';
for(const [role,name] of [['researcher','Researcher'],['reviewer','Reviewer']]){const item=node('div','',$('tasks'));item.className='task';node('strong',name,item);const started=data.events.some(e=>e.role===role&&e.status==='started');node('small',data.results[role]?'Artifact received':data.stage===role?(started?'Session worker dispatched':'Waiting for session worker'):'Waiting for dependency',item);}
function showSource(name,start=1,end=12){$('source-view').hidden=false;$('source-title').textContent=name+' · lines '+start+'–'+end;$('source-lines').textContent=data.texts[name].split('\n').slice(start-1,end).map((line,index)=>(start+index)+'  '+line).join('\n');$('source-title').scrollIntoView({behavior:'instant',block:'nearest'});}
function render(tab){const out=$('output');out.replaceChildren();$('source-view').hidden=true;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));
if(tab==='events'){node('h2','Recorded workflow events',out);for(const e of data.events){const item=node('div','',out);item.className='finding';node('small',e.time,item);node('h3',e.role+' · '+e.status,item);node('p',e.detail,item);}return;}
if(tab==='sources'){node('h2','Committed source manifest',out);node('p','Local technical evidence only. No fresh literature search was performed in this pilot.',out);for(const [name,m] of Object.entries(data.sources)){const b=node('button',name+' · '+m.lines+' lines',out);b.className='citation';b.onclick=()=>showSource(name,1,Math.min(m.lines,30));node('small','SHA-256 '+m.sha256,out);}if(data.missing.length)node('p','Not available at this revision: '+data.missing.join(', '),out);return;}
const result=data.results[tab];node('h2',labels[tab]+(result?.verdict?' · '+result.verdict:''),out);if(!result){node('p','No result has been received for this stage.',out);return;}node('p',result.summary,out);for(const f of result.findings){const item=node('div','',out);item.className='finding';node('p',f.claim,item);for(const c of f.evidence){const b=node('button',c.source+':'+c.start+'–'+c.end,item);b.className='citation';b.onclick=()=>showSource(c.source,c.start,c.end);}}
node('h3',tab==='researcher'?'Experiment proposal · not executed':'Review conclusion / required next step',out);node('p',result.proposal,out);}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));render('researcher');
</script></html>
