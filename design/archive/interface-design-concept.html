<style>
#interface-concept{--i-bg:light-dark(#f6f7f8,#17191c);--i-panel:light-dark(#fff,#202328);--i-ink:light-dark(#232c35,#e8edf2);--i-muted:light-dark(#65727e,#a4b0bc);--i-line:light-dark(#e2e7ea,#363d45);--i-accent:light-dark(#226552,#91d9bd);--i-soft:light-dark(#e9f3ee,#253d34);--i-side:light-dark(#eef1f2,#1b1e22);--i-warn:light-dark(#875c1e,#edc27b);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--i-ink);background:var(--i-bg);border:1px solid var(--i-line);border-radius:14px;overflow:hidden;box-sizing:border-box}
#interface-concept *{box-sizing:border-box}#interface-concept button,#interface-concept input{font:inherit}#interface-concept button{color:inherit;background:none;border:0;text-align:left}#interface-concept .ic-top{display:flex;align-items:center;gap:12px;padding:17px 110px 17px 20px;background:var(--i-panel);border-bottom:1px solid var(--i-line);flex-wrap:wrap}#interface-concept .ic-brand{font-size:18px;font-weight:650;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}#interface-concept .ic-mark{display:grid;place-items:center;width:28px;height:28px;background:var(--i-soft);border-radius:8px;color:var(--i-accent)}#interface-concept .ic-preview{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--i-muted);border-left:1px solid var(--i-line);padding-left:13px}#interface-concept .ic-shell{display:grid;grid-template-columns:172px minmax(0,1fr)}#interface-concept aside{background:var(--i-side);padding:22px 12px;border-right:1px solid var(--i-line)}#interface-concept .ic-label{color:var(--i-muted);text-transform:uppercase;letter-spacing:.09em;font-size:10px;font-weight:600;margin:0 9px 10px}#interface-concept .ic-nav{width:100%;display:flex;align-items:center;gap:9px;padding:10px;border-radius:7px;margin-bottom:3px;font-size:13px}#interface-concept .ic-nav[aria-current=page]{background:var(--i-panel);box-shadow:0 1px 3px light-dark(#0000000b,#00000025);font-weight:600}#interface-concept .ic-nav:hover,#interface-concept .ic-secondary:hover{background:var(--i-soft)}#interface-concept .ic-count{margin-left:auto;font-size:11px;color:var(--i-accent)}#interface-concept .ic-projectlink{font-size:12px;display:block;padding:9px;width:100%;border-radius:7px}#interface-concept .ic-navgroup{margin-top:30px}#interface-concept .ic-foot{margin:32px 9px 0;border-top:1px solid var(--i-line);padding-top:14px;font-size:11px;color:var(--i-muted)}#interface-concept main{min-width:0;padding:26px}#interface-concept .ic-eyebrow{font-size:12px;color:var(--i-muted);margin-bottom:7px}#interface-concept h1{font-size:26px;letter-spacing:-.9px;font-weight:600;line-height:1.2;margin:0}#interface-concept h2{font-size:15px;font-weight:600;margin:0}#interface-concept h3{font-size:14px;font-weight:600;margin:0 0 5px}#interface-concept p{margin:7px 0 0;color:var(--i-muted);font-size:13px}#interface-concept .ic-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}#interface-concept .ic-primary{background:var(--i-accent);color:light-dark(#fff,#153428);padding:9px 13px;border-radius:7px;font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:7px}#interface-concept .ic-secondary{border:1px solid var(--i-line);padding:8px 11px;border-radius:7px;font-size:12px;background:var(--i-panel)}#interface-concept .ic-command{display:flex;gap:9px;padding:10px;border:1px solid var(--i-line);background:var(--i-panel);border-radius:10px;align-items:center;margin:20px 0}#interface-concept .ic-command input{width:100%;min-width:0;border:0;background:transparent;color:var(--i-ink);font-size:13px;padding:6px}#interface-concept input::placeholder{color:var(--i-muted)}#interface-concept .ic-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--i-line);border-left:3px solid var(--i-accent);padding:14px;background:var(--i-panel);border-radius:8px;margin-bottom:20px;flex-wrap:wrap}#interface-concept .ic-banner p{margin:3px 0 0;font-size:12px}#interface-concept .ic-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}#interface-concept .ic-panel{background:var(--i-panel);border:1px solid var(--i-line);border-radius:10px;min-width:0}#interface-concept .ic-panelhead{padding:15px 17px;border-bottom:1px solid var(--i-line);display:flex;align-items:center;justify-content:space-between;gap:8px}#interface-concept .ic-row{padding:16px 17px;border-bottom:1px solid var(--i-line)}#interface-concept .ic-row:last-child{border-bottom:0}#interface-concept .ic-link{color:var(--i-accent);font-size:12px;font-weight:500;padding:3px 0}#interface-concept .ic-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}#interface-concept .ic-tag{font-size:10px;padding:3px 7px;background:var(--i-bg);border-radius:4px;color:var(--i-muted)}#interface-concept .ic-status{font-size:11px;color:var(--i-accent);background:var(--i-soft);padding:3px 7px;border-radius:5px;white-space:nowrap}#interface-concept .ic-agent{display:flex;align-items:flex-start;gap:10px}#interface-concept .ic-avatar{width:29px;height:29px;flex-shrink:0;display:grid;place-items:center;background:var(--i-bg);border:1px solid var(--i-line);border-radius:8px;color:var(--i-muted);font-size:11px}#interface-concept .ic-agent p{font-size:12px;margin-top:2px}#interface-concept .ic-agent button{padding:0;font-size:13px;font-weight:500}#interface-concept .ic-small{font-size:11px;color:var(--i-muted)}#interface-concept .ic-tabs{display:flex;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--i-line);margin-bottom:18px}#interface-concept .ic-tabs button{font-size:12px;padding:10px 0;border-bottom:2px solid transparent;color:var(--i-muted)}#interface-concept .ic-tabs button[aria-pressed=true]{color:var(--i-accent);border-bottom-color:var(--i-accent)}#interface-concept .ic-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}#interface-concept .ic-details{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:12px;margin:15px 0}#interface-concept .ic-details dt{color:var(--i-muted)}#interface-concept .ic-details dd{margin:0}#interface-concept .ic-note{font-size:11px;color:var(--i-muted);margin-top:18px}#interface-concept .ic-notice{margin-top:12px;font-size:12px;color:var(--i-accent)}#interface-concept .ic-bottom{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--i-line);padding:10px 20px;background:var(--i-panel);font-size:10px;color:var(--i-muted)}#interface-concept .ic-bottom span:last-child{margin-left:auto}#interface-concept svg{width:16px;height:16px;flex-shrink:0}#interface-concept .ic-warn{color:var(--i-warn)}#interface-concept .ic-fullbutton{width:100%;padding:0}#interface-concept .ic-connections{display:grid;grid-template-columns:1fr 1fr;gap:14px}#interface-concept .ic-connection{padding:17px}#interface-concept .ic-connection h3{display:flex;justify-content:space-between;gap:8px}
@media(max-width:800px){#interface-concept .ic-grid{grid-template-columns:1fr}#interface-concept main{padding:20px}#interface-concept .ic-shell{grid-template-columns:150px minmax(0,1fr)}}
@media(max-width:560px){#interface-concept .ic-shell{grid-template-columns:1fr}#interface-concept aside{border-right:0;border-bottom:1px solid var(--i-line);padding:8px;display:flex;flex-wrap:wrap;gap:3px}#interface-concept aside .ic-label,#interface-concept .ic-navgroup,#interface-concept .ic-foot{display:none}#interface-concept .ic-nav{width:auto;font-size:11px;padding:8px;gap:5px;margin:0}#interface-concept .ic-nav svg{display:none}#interface-concept main{padding:18px 14px}#interface-concept h1{font-size:23px}#interface-concept .ic-top{padding-left:14px;gap:8px}#interface-concept .ic-preview{border:0;padding:0;font-size:10px}#interface-concept .ic-connections{grid-template-columns:1fr}#interface-concept .ic-command{flex-wrap:wrap}#interface-concept .ic-command input{flex-basis:100%}#interface-concept .ic-details{grid-template-columns:85px 1fr}#interface-concept .ic-bottom span:last-child{margin-left:0}}
@media(pointer:coarse){#interface-concept button{min-height:44px}#interface-concept input{font-size:16px}}
</style>
<div id="interface-concept">
<header class="ic-top"><div class="ic-brand"><span class="ic-mark"><i data-lucide="layers-2" aria-hidden="true"></i></span>interface<span style="color:var(--i-accent)">.</span></div><span class="ic-preview">Design preview · Sample data</span></header>
<div class="ic-shell"><aside aria-label="Main navigation">
<div class="ic-label">Workspace</div>
<button type="button" class="ic-nav cursor-interaction" data-view="lab"><i data-lucide="users" aria-hidden="true"></i>Lab & members</button>
<button type="button" class="ic-nav cursor-interaction" data-view="overview" aria-current="page"><i data-lucide="layout-dashboard" aria-hidden="true"></i>Overview</button>
<button type="button" class="ic-nav cursor-interaction" data-view="project"><i data-lucide="folder-open" aria-hidden="true"></i>Projects</button>
<button type="button" class="ic-nav cursor-interaction" data-view="agents"><i data-lucide="bot" aria-hidden="true"></i>Agents</button>
<button type="button" class="ic-nav cursor-interaction" data-view="library"><i data-lucide="library" aria-hidden="true"></i>Knowledge</button>
<button type="button" class="ic-nav cursor-interaction" data-view="approvals"><i data-lucide="inbox" aria-hidden="true"></i>Approvals<span class="ic-count" id="ic-approval-count">1</span></button>
<button type="button" class="ic-nav cursor-interaction" data-view="connections"><i data-lucide="plug" aria-hidden="true"></i>Connections</button>
<div class="ic-navgroup"><div class="ic-label">Pinned projects</div><button class="ic-projectlink cursor-interaction" data-view="project">◦ LEO handover research</button><button class="ic-projectlink cursor-interaction" data-view="ideas">◦ Idea incubator</button></div>
<div class="ic-foot">Signed in as Niz<br><span style="color:var(--i-accent)">Your AI connection</span><br>Personal and shared projects</div>
</aside><main id="ic-main"></main></div>
<footer class="ic-bottom"><span>No live agents or connected accounts</span><span>Changes stay in this preview</span></footer>
</div>
<script>
(()=>{
const root=document.getElementById('interface-concept');
const main=root.querySelector('#ic-main');
let decision='',paused=false,view='overview',tab='Overview',selectedAgent='Literature researcher';
const agents=[['Literature researcher','Finds papers, extracts evidence, records sources.','Preparing evidence matrix','Web search · Zotero read','Source-linked evidence table'],['Experiment engineer','Turns project questions into bounded experiment plans.','Waiting for your approval','Repository read · isolated execution','Experiment plan + reproducible scripts'],['Critical reviewer','Challenges assumptions, methods, and supporting evidence.','Reviewing the proposed comparison','Project evidence read','Review with evidence and unresolved questions'],['Web collector','Collects and deduplicates material from selected websites.','Ready when assigned','Approved websites · extraction tools','Source records with URLs and retrieval dates']];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const title=(small,big,sub)=>`<div class="ic-title"><div><div class="ic-eyebrow">${small}</div><h1>${big}</h1>${sub?`<p>${sub}</p>`:''}</div></div>`;
const button=(label,target,cls='ic-link')=>`<button type="button" class="${cls} cursor-interaction" data-view="${target}">${label}</button>`;
const agentRows=()=>agents.slice(0,3).map((a,i)=>`<div class="ic-row ic-agent"><span class="ic-avatar">${['LR','EE','CR'][i]}</span><div><button class="cursor-interaction" data-agent="${a[0]}">${a[0]}</button><p>${paused?'Paused in preview':a[2]}</p><div class="ic-small" style="margin-top:7px">LEO handover research</div></div></div>`).join('');
function projectContent(){
if(tab==='Papers')return `<div class="ic-panel"><div class="ic-panelhead"><h2>Evidence before conclusions</h2><span class="ic-status">Sample collection</span></div><div class="ic-row"><h3>Sample research collection</h3><p>Example collection · Papers would show verified titles, authors, DOI, annotations, and the claims they support.</p><div class="ic-tags"><span class="ic-tag">Zotero</span><span class="ic-tag">Linked to research question</span></div></div><div class="ic-row"><h3>Evidence matrix</h3><p>Compare each paper’s assumptions, baseline, metrics, limitations, and reproducibility.</p></div></div>`;
if(tab==='Ideas')return `<div class="ic-panel"><div class="ic-panelhead"><h2>Ideas with a path to validation</h2></div><div class="ic-row"><h3>Adaptive prediction horizons</h3><p>Illustrative hypothesis: vary the prediction horizon with uncertainty in the input reports.</p><div class="ic-tags"><span class="ic-tag">Novelty unverified</span><span class="ic-tag">Needs literature review</span></div></div><div class="ic-row"><h3>Next step</h3><p>Ask the researcher to find related methods, then ask the reviewer to challenge the proposed contribution.</p></div></div>`;
if(tab==='Experiments')return `<div class="ic-panel"><div class="ic-panelhead"><h2>Compare prediction strategies</h2><span class="ic-status">${decision||'Awaiting approval'}</span></div><div class="ic-row"><p>Sample proposal · Compare fixed and adaptive prediction windows under the same traffic scenario.</p><dl class="ic-details"><dt>Outputs</dt><dd>Configuration, logs, plots, and run manifest</dd><dt>Measures</dt><dd>Handovers, outage, throughput</dd><dt>Execution</dt><dd>Isolated run; stop at the configured limit</dd></dl>${button('Review proposed run →','approvals')}</div></div>`;
if(tab==='Files')return `<div class="ic-panel"><div class="ic-panelhead"><h2>Project files</h2><span class="ic-small">Example structure</span></div>${['research-question.md · Project brief','evidence/ · Sources and extraction notes','experiments/ · Configurations and run records','drafts/ · Paper drafts and reviewer feedback'].map(f=>`<div class="ic-row">${f}</div>`).join('')}</div>`;
return `<div class="ic-grid"><div class="ic-panel"><div class="ic-panelhead"><h2>Research direction</h2><span class="ic-status">Example brief</span></div><div class="ic-row"><h3>Reduce unnecessary handovers while preserving service quality</h3><p>Keep hypotheses, evidence, experiments, and manuscript decisions connected to this question.</p></div><div class="ic-row"><h3>Next decision</h3><p>Review the comparison experiment before allocating compute.</p>${button('Open proposal →','approvals')}</div><div class="ic-row"><h3>Shared project memory</h3><p>Accepted decisions, known limitations, source provenance, and what to try next.</p></div></div><div class="ic-panel"><div class="ic-panelhead"><h2>Project agents</h2>${button('Manage','agents')}</div>${agentRows()}</div></div>`;
}
function render(){
root.querySelectorAll('.ic-nav').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
root.querySelector('#ic-approval-count').textContent=decision?'0':'1';
if(view==='lab'){
main.innerHTML=title('Workspace / Collaboration','Your lab. Everyone’s own AI.','Private workspaces, optional shared projects, and individual provider connections.')+`<div class="ic-grid"><section class="ic-panel"><div class="ic-panelhead"><h2>Workspace visibility</h2><span class="ic-small">Proposed design</span></div><div class="ic-row"><h3>Personal workspace</h3><p>Your drafts, email, calendar, private files, and personal agent history. Visible only to you.</p><div class="ic-tags"><span class="ic-tag">Private by default</span></div></div><div class="ic-row"><h3>Shared lab projects</h3><p>Members see the project’s explicitly shared papers, tasks, results, decisions, and agent activity.</p><div class="ic-tags"><span class="ic-tag">Owner</span><span class="ic-tag">Editor</span><span class="ic-tag">Viewer</span></div></div><div class="ic-row"><h3>Join the lab</h3><p>Accept an invitation, connect your own supported AI account, then choose which projects to join.</p></div></section><section class="ic-panel"><div class="ic-panelhead"><h2>Who pays for a run?</h2></div><div class="ic-row"><h3>Visible before every run</h3><dl class="ic-details"><dt>Initiated by</dt><dd>Niz · Example</dd><dt>AI connection</dt><dd>Niz’s provider account</dd><dt>Output shared</dt><dd>Only with the selected project</dd><dt>Approval</dt><dd>Connection owner for usage; authorized editor for shared changes</dd></dl></div><div class="ic-row"><h3>Credentials stay private</h3><p>Project access does not grant access to another member’s AI account or personal integrations.</p></div><div class="ic-row"><h3>Subscription compatibility</h3><p>Supported sign-in methods must be verified per provider. Subscription access and API billing are separate connection choices.</p></div></section></div><div class="ic-note">Sample design only · No invitations sent and no accounts connected.</div>`;
if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});
return;
}
if(view==='overview')main.innerHTML=title('Your workspace','A clear view of your work.','Projects, evidence, and agents — with decisions in your hands.')+`<form class="ic-command" id="ic-command"><input aria-label="Task to preview" placeholder="What would you like your agents to work on?"><button class="ic-primary cursor-interaction" type="submit">Plan a task ${icon('arrow-up-right')}</button></form><div id="ic-command-result" class="ic-notice" aria-live="polite"></div><div class="ic-banner"><div><h3>${decision?'Decision recorded in preview':'An experiment is ready for your review'}</h3><p>${decision?'The sample proposal is '+decision.toLowerCase()+'.':'Compare prediction strategies · LEO handover research'}</p></div>${button('Review proposal','approvals','ic-secondary')}</div><div class="ic-grid"><section class="ic-panel"><div class="ic-panelhead"><h2>Pick up a project</h2>${button('Open workspace →','project')}</div><div class="ic-row"><h3>LEO handover research</h3><p>From literature and hypotheses to reproducible experiments.</p><div class="ic-tags"><span class="ic-tag">Research</span><span class="ic-tag">${decision?'Proposal reviewed':'Decision needed'}</span></div><div style="margin-top:13px">${button('Open project →','project')}</div></div><div class="ic-row"><h3>Idea incubator</h3><p>Collect promising questions. Check the evidence before committing.</p><div style="margin-top:13px">${button('Explore ideas →','ideas')}</div></div></section><section class="ic-panel"><div class="ic-panelhead"><h2>Agent activity</h2><span class="ic-small">Sample run</span></div>${agentRows()}</section></div><div class="ic-note">Your workspace opens with what changed, what needs you, and where to continue.</div>`;
else if(view==='project'||view==='ideas'){if(view==='ideas')tab='Ideas';main.innerHTML=title('Projects / Research','LEO handover research','One project memory, shared across every agent.')+`<div class="ic-tabs" aria-label="Project sections">${['Overview','Papers','Ideas','Experiments','Files'].map(t=>`<button class="cursor-interaction" data-tab="${t}" aria-pressed="${t===tab}">${t}</button>`).join('')}</div>`+projectContent();}
else if(view==='agents')main.innerHTML=title('Agent workspace','Specialists with clear boundaries.','Choose a role to inspect its tools, output, and authority.')+`<div class="ic-title"><span class="ic-small">Model provider: OpenAI · Proposed configuration</span><button class="ic-secondary cursor-interaction" data-action="pause">${paused?'Resume sample agents':'Pause sample agents'}</button></div><div class="ic-grid"><div class="ic-panel">${agents.map(a=>`<div class="ic-row"><button class="ic-fullbutton cursor-interaction" data-agent="${a[0]}" aria-pressed="${a[0]===selectedAgent}"><h3>${a[0]}</h3><p>${a[1]}</p><div class="ic-tags"><span class="ic-status">${paused?'Paused':a[0]===selectedAgent?'Selected role':'OpenAI'}</span></div></button></div>`).join('')}</div><div class="ic-panel"><div class="ic-panelhead"><h2>${selectedAgent}</h2></div><div class="ic-row"><dl class="ic-details"><dt>Tools</dt><dd>${agents.find(a=>a[0]===selectedAgent)[3]}</dd><dt>Delivers</dt><dd>${agents.find(a=>a[0]===selectedAgent)[4]}</dd><dt>Context</dt><dd>Selected project and its linked sources</dd><dt>Approval</dt><dd>Required for external changes</dd><dt>Run limit</dt><dd>Finite task; stop when complete or blocked</dd></dl><p>Each run shows its actions, sources, output, and why it stopped.</p></div></div></div>`;
else if(view==='approvals')main.innerHTML=title('Decision inbox','You have the final say.','Review the exact action and its scope before it runs.')+`<div class="ic-panel"><div class="ic-panelhead"><h2>Run a comparison experiment</h2><span class="ic-status">${decision||'Needs approval'}</span></div><div class="ic-row"><div class="ic-small">Experiment engineer → LEO handover research · Sample proposal</div><dl class="ic-details"><dt>Proposal</dt><dd>Compare fixed and adaptive prediction windows using matching scenarios.</dd><dt>Will create</dt><dd>A new experiment folder with configurations, logs, and result plots.</dd><dt>Run boundary</dt><dd>One isolated run; sample limit of 30 minutes.</dd><dt>Will access</dt><dd>Only the selected project repository and approved compute target.</dd><dt>Estimate</dt><dd>Not available in this preview; actual usage and compute estimates belong here.</dd></dl>${decision?`<p class="ic-notice" role="status">${decision} in this preview. No experiment was executed.</p><div class="ic-actions"><button class="ic-secondary cursor-interaction" data-decision="">Reset sample</button></div>`:`<div class="ic-actions"><button class="ic-primary cursor-interaction" data-decision="Approved">Approve once</button><button class="ic-secondary cursor-interaction" data-decision="Revision requested">Request changes</button><button class="ic-secondary cursor-interaction" data-decision="Declined">Decline</button></div>`}</div></div><div class="ic-note">The same proposal could later be reviewed here or through a secure approval link from Telegram or email.</div>`;
else if(view==='connections')main.innerHTML=title('Connected workspace','Your tools, in one place.','Proposed integrations · Nothing is connected in this preview.')+`<div class="ic-connections">${[['Zotero','Papers, metadata, PDFs, and annotations','Read first'],['Obsidian','Project notes and linked knowledge','Read first'],['Notion','Project briefs, tasks, and shared documents','Review writes'],['Files & repositories','Local folders, code, and experiment artifacts','Choose folders'],['Email & calendar','Priority digest and proposed schedule changes','Later phase'],['Telegram','Notifications and approval links','Later phase']].map(a=>`<div class="ic-panel ic-connection"><h3>${a[0]}</h3><p>${a[1]}</p><div class="ic-tags"><span class="ic-tag">${a[2]}</span><span class="ic-tag">Not connected</span></div></div>`).join('')}</div>`;
else main.innerHTML=title('Knowledge','Follow the evidence.','Find sources across projects without losing where they came from.')+`<div class="ic-panel"><div class="ic-panelhead"><h2>Project knowledge</h2><span class="ic-small">Sample structure</span></div>${[['Sources','Papers, webpages, PDFs, and notes with provenance.'],['Claims & evidence','See which source supports a statement and what remains uncertain.'],['Decisions','Accepted hypotheses, rejected ideas, and the reasoning behind them.'],['Results','Experiment outputs linked to code, configuration, and research questions.']].map(a=>`<div class="ic-row"><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join('')}<div class="ic-row">${button('Explore project papers →','project','ic-secondary')}</div></div>`;
if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;if(view==='project')tab='Overview';render();}else if(b.dataset.tab){view='project';tab=b.dataset.tab;render();}else if(b.dataset.agent){selectedAgent=b.dataset.agent;view='agents';render();}else if(b.dataset.action==='pause'){paused=!paused;render();}else if(b.hasAttribute('data-decision')){decision=b.dataset.decision;render();}});
root.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');const out=root.querySelector('#ic-command-result');out.textContent=input.value.trim()?'Preview only: this would open a proposed task with its project, agents, sources, limits, and approval requirements.':'Enter a task to preview the planning flow.';});
render();
})();
</script>
