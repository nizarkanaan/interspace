<div id="ispace">
<header class="s-top"><div class="s-brand"><span class="s-logo" aria-hidden="true"></span>interspace</div><span class="s-mono s-muted">PERSONAL OBSERVATORY</span><span class="s-topnote">Design study / 01</span></header>
<div class="s-shell"><nav class="s-sidebar" aria-label="Workspace navigation"><div class="s-kicker">Workspace</div>
<button class="s-nav cursor-interaction" data-page="overview" aria-current="page"><span class="s-navmark" aria-hidden="true">◉</span>Overview</button><button class="s-nav cursor-interaction" data-page="project"><span class="s-navmark" aria-hidden="true">▤</span>Projects</button><button class="s-nav cursor-interaction" data-page="agents"><span class="s-navmark" aria-hidden="true">⌘</span>Agents</button><button class="s-nav cursor-interaction" data-page="knowledge"><span class="s-navmark" aria-hidden="true">◇</span>Knowledge</button><button class="s-nav cursor-interaction" data-page="decisions"><span class="s-navmark" aria-hidden="true">↗</span>Decisions<span class="s-badge" id="is-count">1</span></button><button class="s-nav cursor-interaction" data-page="connections"><span class="s-navmark" aria-hidden="true">⊞</span>Connections</button>
<div class="s-projectnav"><div class="s-kicker">In your orbit</div><button data-page="project" class="cursor-interaction"><span class="s-dot"></span>Sample project</button><button data-page="ideas" class="cursor-interaction"><span class="s-dot amber"></span>Idea studio</button></div>
<div class="s-machine"><div class="s-mono">YOUR MACHINE</div><div style="margin-top:7px">Local workspace<br>Your accounts · Your files</div></div></nav><main class="s-main" id="is-main"></main></div>
<footer class="s-footer"><span>PROTOTYPE · Sample data</span><span>No agents running</span><span>No connected accounts</span></footer>
</div>
<script>
(()=>{
const root=document.getElementById('ispace'),main=root.querySelector('#is-main');
let page='agents',tab='Brief',agent='Researcher',decision='',empty=false,paused=false,revision=false;
let workView='tasks',selectedTask='evidence',handoffPreview=false;
const roles={Researcher:['R','Find → Extract → Cite','Search papers and build an evidence matrix.','Web search, selected PDFs, Zotero (read)','Evidence table with sources and unresolved questions'],Builder:['B','Plan → Execute → Report','Prepare code changes and reproducible experiments.','Selected repository, isolated runner','Patch, experiment manifest, logs and results'],Reviewer:['V','Inspect → Challenge → Verify','Check methods, assumptions, and evidence.','Project evidence and proposed outputs (read)','Review findings with severity and supporting evidence'],Scout:['S','Collect → Filter → Deduplicate','Monitor approved sites and bring back relevant material.','Approved websites and extraction tools','Source collection with URLs and retrieval dates']};
const workItems=[
  {id:'sources',role:'Scout',title:'Collect related methods',state:'Done',activity:'Source collection prepared',output:'source-collection.json'},
  {id:'evidence',role:'Researcher',title:'Build an evidence matrix',state:'Working',activity:'Extracting methods and baselines',output:'evidence-matrix.md'},
  {id:'experiment',role:'Builder',title:'Compare prediction strategies',state:'Needs you',activity:'Waiting for experiment approval',output:'experiment-plan.md'},
  {id:'review',role:'Reviewer',title:'Review the supporting evidence',state:'Queued',activity:'Waiting for the evidence matrix',output:'evidence-review.md'}
];

function getWorkItems(){
  return workItems.map(item=>{
    let state=item.state,activity=item.activity;
    if(handoffPreview&&item.id==='evidence'){state='Done';activity='Evidence matrix handed to Reviewer';}
    if(handoffPreview&&item.id==='review'){state='Working';activity='Checking claims against the evidence';}
    if(item.id==='experiment'&&decision){
      state=decision==='Approved'?'Queued':decision==='Declined'?'Done':'Needs you';
      activity=decision==='Approved'?'Approved in preview; no run started':decision==='Declined'?'Proposal declined in preview':'Revising the proposed experiment';
    }
    return {...item,state,activity:paused&&state==='Working'?'Paused in preview':activity,label:paused&&state==='Working'?'Paused':state};
  });
}

function renderTaskBoard(items){
  return `<div class="aw-board" aria-label="Task board">${['Queued','Working','Needs you','Done'].map(state=>{
    const laneItems=items.filter(item=>item.state===state);
    return `<section class="aw-lane" aria-label="${state} tasks"><div class="aw-lanehead"><span>${state}</span><span>${laneItems.length}</span></div>${laneItems.length?laneItems.map(item=>`<button class="aw-task cursor-interaction" data-task="${item.id}" aria-label="Inspect ${item.title}" aria-pressed="${selectedTask===item.id}"><span class="s-mono s-muted">${item.role}</span><h3>${item.title}</h3><p>${item.activity}</p><div class="s-metadata"><span>${item.label}</span></div></button>`).join(''):'<div class="aw-empty">No tasks</div>'}</section>`;
  }).join('')}</div>`;
}

function renderWorkstation(item){
  return `<button class="aw-station cursor-interaction" data-task="${item.id}" data-role="${item.role}" aria-label="Inspect ${item.title}" aria-pressed="${selectedTask===item.id}"><div class="aw-stationtop"><span class="aw-avatar" aria-hidden="true">${roles[item.role][0]}</span><span class="s-pill ${item.state==='Needs you'?'wait':''}">${item.label}</span></div><div class="aw-monitor"><span class="s-mono">${item.role.toUpperCase()} / WORKSTATION</span><p>${item.activity}</p></div><div class="aw-stationbottom"><span>${item.title}</span><span aria-hidden="true">↗</span></div></button>`;
}

function renderObservatory(items){
  const station=id=>renderWorkstation(items.find(item=>item.id===id));
  return `<section class="aw-lab" aria-label="Agent observatory"><div class="aw-labhead"><div><div class="s-kicker">Sample project / Research lab</div><p>Four specialists. One project.</p></div><span class="s-mono s-muted">SAMPLE ACTIVITY</span></div><div class="aw-room">${station('sources')}${station('evidence')}<div class="aw-handoff"><span>${handoffPreview?'Researcher':'Scout'}</span><span aria-hidden="true">→</span><span class="aw-packet s-mono">${handoffPreview?'evidence-matrix.md':'source-collection.json'}</span><span aria-hidden="true">→</span><span>${handoffPreview?'Reviewer':'Researcher'}</span></div>${station('experiment')}${station('review')}</div></section>`;
}

function renderTaskDetail(item){
  const role=roles[item.role];
  return `<section class="aw-detail" aria-label="Selected task"><div class="s-sectionhead"><span class="s-kicker">${item.role} / Selected task</span><span class="s-pill ${item.state==='Needs you'?'wait':''}">${item.label}</span></div><h2>${item.title}</h2><div class="aw-detailbody"><div><div class="s-kicker">Latest activity</div><p>${item.activity}</p></div><div><div class="s-kicker">${item.state==='Done'?'Sample output':'Expected output'}</div><p class="s-mono">${item.output}</p></div></div>${item.id==='experiment'?`<div style="margin-top:14px">${btn('Inspect proposal ↗','decisions')}</div>`:''}<details><summary class="cursor-interaction">Role, tools & boundaries</summary><dl class="s-detail"><dt>Role</dt><dd>${role[2]}</dd><dt>Tools</dt><dd>${role[3]}</dd><dt>Provider</dt><dd>OpenAI · connection pending</dd><dt>Scope</dt><dd>Selected project only; bounded runs; approval before external changes</dd></dl></details></section>`;
}

function renderAgentWorkspace(){
  const items=getWorkItems(),item=items.find(task=>task.id===selectedTask);
  return head('Workspace / Agents','One team. Two perspectives.')+
    `<div class="aw-toolbar"><div class="aw-switch" role="group" aria-label="Workspace view"><button class="cursor-interaction" data-workview="tasks" aria-pressed="${workView==='tasks'}">Tasks</button><button class="cursor-interaction" data-workview="observatory" aria-pressed="${workView==='observatory'}">Observatory</button></div><div class="s-actions"><button class="s-button cursor-interaction" data-action="handoff" ${paused?'disabled':''}>${handoffPreview?'Reset handoff':'Preview handoff'}</button><button class="s-button cursor-interaction" data-action="pause">${paused?'Resume sample':'Pause sample'}</button></div></div>`+
    (workView==='tasks'?renderTaskBoard(items):renderObservatory(items))+
    `<div class="aw-live" role="status">${handoffPreview?'Sample handoff: Researcher delivered the evidence matrix to Reviewer.':'Sample workspace · No real agents are running.'}</div>`+
    renderTaskDetail(item);
}
const btn=(text,to,style='s-button')=>`<button class="${style} cursor-interaction" data-page="${to}">${text}</button>`;
const head=(crumb,title,action='')=>`<div class="s-heading"><div><div class="s-kicker">${crumb}</div><h1>${title}</h1></div>${action}</div>`;
const activity=()=>`<section><div class="s-sectionhead"><span class="s-kicker">Agent signals</span><span class="s-mono s-muted">SAMPLE</span></div>${getWorkItems().filter(item=>item.role!=='Scout').map(item=>`<div class="s-run"><span class="s-runmark">${roles[item.role][0]}</span><div><button class="cursor-interaction" data-agent="${item.role}">${item.role}</button><p>${item.activity}</p><span class="s-mono">${item.label.toUpperCase()}</span></div></div>`).join('')}</section>`;
const compose=()=>`<form class="s-compose" id="is-command"><input aria-label="Describe a task" placeholder="Give your workspace a direction…"><span class="s-context">Current project</span><button class="s-button s-primary cursor-interaction" type="submit">Plan task ↗</button></form><div id="is-feedback" role="status"></div>`;
function projectBody(){
if(tab==='Papers')return `<div class="s-surface"><div class="s-row s-sectionhead"><h2>Evidence collection</h2><span class="s-pill">Sample structure</span></div><div class="s-row"><h3>Prediction-based handover methods</h3><p>Collection awaiting real sources. Verified titles, authors, DOI links, notes, and claim-level citations would appear here.</p><div class="s-metadata"><span>Zotero source</span><span>Researcher</span><span>Not connected</span></div></div><div class="s-row"><h3>Comparison matrix</h3><p>Assumptions · baselines · metrics · limitations · reproducibility</p></div></div>`;
if(tab==='Hypotheses')return `<div class="s-surface"><div class="s-row"><span class="s-pill wait">Novelty unverified</span><h3 style="margin-top:12px">Adapt the prediction horizon to uncertainty</h3><p>Sample hypothesis: shorter horizons under unreliable reports may reduce avoidable handovers.</p><dl class="s-detail"><dt>Evidence</dt><dd>Not collected</dd><dt>Falsification</dt><dd>No improvement over a fixed horizon under matched scenarios</dd><dt>Next step</dt><dd>Check prior work, then define a controlled comparison</dd></dl></div></div>`;
if(tab==='Experiments')return `<div class="s-surface"><div class="s-row"><div class="s-sectionhead"><h2>Fixed versus adaptive horizon</h2><span class="s-pill wait">${decision||'Needs decision'}</span></div><p>Sample experiment proposal</p><dl class="s-detail"><dt>Compare</dt><dd>Matched traffic, topology, and random seeds</dd><dt>Measure</dt><dd>Handover rate, outage, throughput</dd><dt>Retain</dt><dd>Code revision, config, logs, and plots</dd></dl>${btn('Inspect proposal ↗','decisions')}</div></div>`;
if(tab==='Files')return `<div class="s-surface">${[['brief.md','Research question and boundaries'],['evidence/','Sources and extraction notes'],['experiments/','Configurations and result manifests'],['drafts/','Manuscript and review history']].map(a=>`<div class="s-row"><span class="s-mono">${a[0]}</span><p>${a[1]}</p></div>`).join('')}</div><p class="s-note">Illustrative structure; no local folders have been accessed.</p>`;
return `<div class="s-grid"><section class="s-surface"><div class="s-row"><div class="s-kicker">Research question</div><h3 style="font-size:18px;letter-spacing:-.4px;margin-top:9px">When should a handover happen?</h3><p>Explore predictive strategies that reduce unnecessary switching while preserving service quality.</p></div><div class="s-row"><div class="s-kicker">Next decision</div><h3 style="margin-top:8px">Approve the comparison experiment</h3><p>Review the scope, compute limit, and expected outputs.</p><div style="margin-top:13px">${btn('Review proposal ↗','decisions')}</div></div><div class="s-row"><h3>Project memory</h3><p>Decisions, evidence, constraints, and open questions survive individual agent runs.</p></div></section>${activity()}</div>`;
}
function render(){
root.querySelectorAll('.s-nav').forEach(n=>{if(n.dataset.page===page)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});root.querySelector('#is-count').textContent=decision?'0':'1';
if(page==='overview')main.innerHTML=head('Workspace / Overview','A wider view.',`<button class="s-button cursor-interaction" data-action="empty">${empty?'Show sample workspace':'Preview first launch'}</button>`)+(empty?`<div class="s-surface s-blank"><div class="s-kicker">Your space starts here</div><h2 style="margin-top:12px;font-size:20px">Bring one project into orbit.</h2><p>Choose a folder, connect an AI account, and define the first task.</p>${btn('Explore connection setup','connections','s-button s-primary')}</div>`:`<div class="s-grid"><section><div class="s-sectionhead"><span class="s-kicker">Project atlas</span><span class="s-mono s-muted">01 / RESEARCH</span></div><div class="s-project"><div class="s-projecttop"><div><h2>Sample project</h2><p>Predictive methods & reproducible experiments</p></div><span class="s-pill">Research</span></div><div class="s-map" aria-label="Project map linking evidence, hypotheses, experiments and review"><div class="s-orbit" aria-hidden="true"></div><div class="s-center"><b>Research question</b><span>The centre of this project</span></div><button class="s-node n1 cursor-interaction" data-tab="Papers"><span class="s-dot"></span>Evidence ↗</button><button class="s-node n2 cursor-interaction" data-tab="Hypotheses"><span class="s-dot amber"></span>Hypotheses ↗</button><button class="s-node n3 cursor-interaction" data-tab="Experiments"><span class="s-dot amber"></span>Experiments ↗</button><button class="s-node n4 cursor-interaction" data-agent="Reviewer"><span class="s-dot"></span>Review ↗</button></div><div class="s-projectbottom"><span class="s-muted">${decision?'Proposal reviewed':'One decision to move forward'}</span>${btn('Enter project →','project','s-link')}</div></div><div class="s-nextproject"><span class="s-projectnum">02</span><div><h3>Idea studio</h3><p>Questions worth investigating.</p></div><button aria-label="Open idea studio" data-page="ideas" class="cursor-interaction">↗</button></div></section><aside class="s-rail"><div class="s-decision"><div class="s-kicker">${decision?'Decision recorded':'Your attention'}</div><h3>${decision||'Ready for an experiment?'}</h3><p>Review the fixed-versus-adaptive comparison before starting a run.</p>${btn('Inspect proposal ↗','decisions')}</div>${activity()}</aside></div>`)+compose();
else if(page==='project')main.innerHTML=head('Projects / Research','Sample project',`<span class="s-pill">Local project</span>`)+`<div class="s-tabs" aria-label="Project sections">${['Brief','Papers','Hypotheses','Experiments','Files'].map(t=>`<button class="cursor-interaction" data-tab="${t}" aria-pressed="${tab===t}">${t}</button>`).join('')}</div>`+projectBody()+compose();
else if(page==='agents')main.innerHTML=renderAgentWorkspace();
else if(page==='decisions')main.innerHTML=head('Workspace / Decisions','Move work forward.',`<span class="s-mono s-muted">${decision?'0':'1'} PENDING</span>`)+`<div class="s-surface"><div class="s-row"><div class="s-sectionhead"><span class="s-kicker">Builder / Sample project</span><span class="s-pill wait">${decision||'Awaiting you'}</span></div><h3 style="font-size:20px;letter-spacing:-.5px">Compare two prediction strategies</h3><p>Sample proposal · no execution is connected.</p><dl class="s-detail"><dt>Action</dt><dd>Run one matched comparison of fixed and adaptive prediction horizons.</dd><dt>Writes</dt><dd>Create a new experiment directory; preserve existing results.</dd><dt>Access</dt><dd>Selected project repository and approved compute target.</dd><dt>Stop after</dt><dd>One run or 30 minutes, whichever comes first (illustrative limit).</dd><dt>Usage</dt><dd>Estimate unavailable in this prototype. Final approval must show the account and run budget.</dd></dl>${decision?`<div class="s-state" role="status">${decision} in preview. No real action was taken.</div><div style="margin-top:14px"><button class="s-button cursor-interaction" data-decision="">Reset sample</button></div>`:revision?`<form id="is-revision"><label for="is-revision-text" class="s-kicker">What should change?</label><textarea id="is-revision-text" required placeholder="For example: use a smaller scenario before the full run."></textarea><div class="s-actions" style="margin-top:10px"><button class="s-button s-primary cursor-interaction" type="submit">Return with feedback</button><button class="s-button cursor-interaction" type="button" data-action="cancel-revision">Cancel</button></div></form>`:`<div class="s-actions"><button class="s-button s-primary cursor-interaction" data-decision="Approved">Approve once ↗</button><button class="s-button cursor-interaction" data-action="revision">Request changes</button><button class="s-button cursor-interaction" data-decision="Declined">Decline</button></div>`}</div></div><p class="s-note">Later: Telegram or email can bring you to the same scoped approval.</p>`;
else if(page==='connections')main.innerHTML=head('Workspace / Connections','Your tools. Your accounts.')+`<div class="s-surface">${[['OpenAI','Your own provider connection. Supported subscription authentication to be verified.','Inspect setup'],['Zotero','Papers, metadata, PDFs, and annotations.','Choose access'],['Obsidian & folders','Only the vaults and folders you explicitly select.','Choose access'],['Notion','Project pages, tasks, and documents.','Choose access'],['Email & calendar','Summaries and proposed changes. Later phase.','View scope']].map(a=>`<div class="s-row s-connection"><div style="flex:1;min-width:170px"><h3>${a[0]}</h3><p>${a[1]}</p><div class="s-metadata"><span>Not connected</span></div></div><button class="s-button cursor-interaction" data-connection="${a[0]}">${a[2]} ↗</button></div>`).join('')}</div><div id="is-access" role="status"></div><p class="s-note">Each person installs Interspace independently. Sharing the software never shares your files, accounts, or allowance.</p>`;
else if(page==='ideas')main.innerHTML=head('Workspace / Idea studio','Make room for the next question.')+`<div class="s-surface"><div class="s-row"><span class="s-pill wait">Sample idea · Unverified</span><h3 style="font-size:19px;margin-top:13px">Can uncertainty guide the prediction horizon?</h3><p>A promising question becomes a project only after checking prior work, feasibility, and a testable contribution.</p><div class="s-metadata"><span>Scout → Researcher → Reviewer</span></div><div style="margin-top:16px"><button data-tab="Hypotheses" class="s-button cursor-interaction">Inspect hypothesis ↗</button></div></div></div>`+compose();
else main.innerHTML=head('Workspace / Knowledge','Keep the thread of evidence.')+`<div class="s-surface">${[['Sources','Papers, webpages, notes and datasets, with their origin preserved.'],['Claims','Statements linked to supporting and contradicting sources.'],['Decisions','What you accepted or rejected, and why.'],['Artifacts','Code, reports and experiment results tied to the run that produced them.']].map(a=>`<div class="s-row"><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join('')}</div><p class="s-note">Sample knowledge structure. No project files or research sources have been imported.</p>`;
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;if(page==='project')tab='Brief';render();}else if(b.dataset.tab){page='project';tab=b.dataset.tab;render();}else if(b.dataset.workview){workView=b.dataset.workview;render();root.querySelector('[data-workview='+workView+']').focus();}else if(b.dataset.task){selectedTask=b.dataset.task;agent=workItems.find(item=>item.id===selectedTask).role;render();root.querySelector('[data-task='+selectedTask+']').focus();}else if(b.dataset.agent){page='agents';agent=b.dataset.agent;selectedTask=workItems.find(item=>item.role===agent).id;render();}else if(b.hasAttribute('data-decision')){decision=b.dataset.decision;revision=false;render();}else if(b.dataset.action){if(b.dataset.action==='empty')empty=!empty;if(b.dataset.action==='pause')paused=!paused;if(b.dataset.action==='handoff'&&!paused){handoffPreview=!handoffPreview;selectedTask=handoffPreview?'review':'evidence';}if(b.dataset.action==='revision')revision=true;if(b.dataset.action==='cancel-revision')revision=false;render();if(b.dataset.action==='handoff'&&workView==='observatory'&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){root.querySelector('.aw-packet').animate([{transform:'translateX(-12px)',opacity:.5},{transform:'translateX(0)',opacity:1}],{duration:350,easing:'ease-out'});}}else if(b.dataset.connection){const area=root.querySelector('#is-access');area.className='s-surface s-row';area.style.marginTop='14px';area.textContent=b.dataset.connection==='OpenAI'?'Connection preview: choose a supported sign-in method or an API key. These are separate billing paths. No credentials are requested or stored in this prototype.':'Access preview: select the sources this connection can read. Proposed writes require approval. No connection was made.';}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='is-revision'){decision='Changes requested';revision=false;render();return;}const input=e.target.querySelector('input'),out=root.querySelector('#is-feedback');out.className='s-state'+(input.value.trim()?'':' error');out.textContent=input.value.trim()?'Sample plan prepared: confirm the project, agent, allowed tools, and run limit before execution. No agent was started.':'Add a task or research question first.';});render();
})();
</script>
